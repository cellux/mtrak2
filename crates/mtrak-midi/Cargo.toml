[package]
name = "mtrak-midi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable MIDI backend abstraction for mtrak (real-time output/input)."

[dependencies]
mtrak-core.workspace = true
mtrak-engine.workspace = true
thiserror.workspace = true

[features]
default = []
# Enables the real `midir` backend. Kept optional so the core and tests build
# without a system MIDI stack.
midir-backend = ["dep:midir"]

[dependencies.midir]
version = "0.10"
optional = true

[lints]
workspace = true
